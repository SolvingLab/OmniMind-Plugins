name: Scan plugin decay
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-publish
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'SolvingLab/OmniMind-Plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scan-decay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate
      - name: Publish decay state and catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/decay-state.json dist/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: apply plugin decay scan'
            git push
          fi
